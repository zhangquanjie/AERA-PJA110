name: Build AERA for PJA110

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "aera-pja110/**"
      - ".github/workflows/build-aera-pja110.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install build dependencies and repo
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs \
            gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync AERA 16.0 source
        working-directory: ${{ runner.temp }}
        run: |
          mkdir aera
          cd aera
          "$HOME/bin/repo" init --depth=1 -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0
          "$HOME/bin/repo" sync -c --force-sync --no-clone-bundle --no-tags -j4

      - name: Add PJA110 device tree
        run: |
          mkdir -p "${{ runner.temp }}/aera/device/oneplus/pja110"
          rsync -a --delete aera-pja110/ "${{ runner.temp }}/aera/device/oneplus/pja110/"

      - name: Build recovery image
        working-directory: ${{ runner.temp }}/aera
        env:
          ALLOW_MISSING_DEPENDENCIES: "true"
          USE_CCACHE: "1"
          CCACHE_EXEC: /usr/bin/ccache
        run: |
          source build/envsetup.sh
          lunch twrp_pja110-bp2a-eng
          mka adbd recoveryimage -j4

      - name: Validate image
        run: |
          image="${{ runner.temp }}/aera/out/target/product/pja110/recovery.img"
          test -f "$image"
          test "$(stat -c %s "$image")" -le 104857600
          cp "$image" AERA-16.0-pja110-crDroid-Android17-20261118.img
          sha256sum AERA-16.0-pja110-crDroid-Android17-20261118.img > AERA-16.0-pja110-crDroid-Android17-20261118.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: AERA-16.0-pja110-crDroid-Android17-20261118
          path: |
            AERA-16.0-pja110-crDroid-Android17-20261118.img
            AERA-16.0-pja110-crDroid-Android17-20261118.sha256
          if-no-files-found: error
          retention-days: 14
